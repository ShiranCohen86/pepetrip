# Render Blueprint — single web service that serves both the API and the built SPA.
# Set the secret env vars (sync:false) in the Render dashboard.
services:
  - type: web
    name: pepetrip
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: COOKIE_SECURE
        value: 'true'
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      # Durable media storage (free Cloudinary tier). Without this, uploads are
      # ephemeral on Render's free tier (lost on redeploy).
      - key: STORAGE_DRIVER
        value: cloudinary
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_TTL_DAYS
        value: '30'
      # Secrets — set these in the dashboard (not committed):
      - key: MONGODB_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CLOUDINARY_URL
        sync: false
